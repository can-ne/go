version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: whiteboard-db
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard_dev_password
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
